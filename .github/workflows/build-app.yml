name: Build VAGScan app

# Produces the double-clickable app. Windows is the one that matters for
# this project (a paired ELM327 shows up as a COM port there), but Linux is
# cheap to build alongside and the spec file is identical.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publicar un Release con esta etiqueta (ej. v0.1.0). Vacío = solo artefactos."
        required: false
        default: ""

# Needed to attach the built app to a Release. Actions artifacts are awkward
# to get at - you have to be signed in and dig through the CI run - whereas a
# Release asset on a public repo is a plain download link.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: VAGScan-Windows
            binary: dist/VAGScan.exe
          - os: ubuntu-latest
            artifact: VAGScan-Linux
            binary: dist/VAGScan
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest -q

      - name: Build executable
        run: pyinstaller --clean --noconfirm packaging/vagscan.spec

      - name: Verify the packaged app is intact
        # Catches the failure mode that matters most: an app that launches
        # but shipped without its fault-code database.
        run: python packaging/verify_build.py "${{ matrix.binary }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: VAGScan ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: ${{ matrix.binary }}
          fail_on_unmatched_files: true
          body: |
            Descargá **VAGScan.exe** de acá abajo y hacele doble clic. No
            necesitás instalar Python ni nada más.

            Windows va a advertir sobre una aplicación no reconocida la
            primera vez (el ejecutable no está firmado digitalmente):
            *Más información → Ejecutar de todas formas*.

            Si algo se ve raro, corré `VAGScan.exe --selftest` - comprueba
            que la app esté íntegra y lista los puertos que ve, sin
            necesidad del auto.
